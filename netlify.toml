[build]
  command = "pnpm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.2"

# Page/article and encoded topic-path aliases are generated in _redirects.
# Netlify serves _site/404.html with HTTP 404 for all unknown paths.
#
# Frozen migration for the old blog's three pages and 21 normalized tags.
# Netlify matches decoded query values; _redirects cannot represent spaces.
# /blog and /blog/ are normalized by Netlify, so one source rule covers both.
# Do not add a page=1 redirect: retained query parameters would cause a loop.
# New CMS tags already link to canonical static archives and need no query rule.

[[redirects]]
  from = "/blog"
  to = "/blog/page/2/"
  status = 301
  force = true
  query = {page = "2"}

[[redirects]]
  from = "/blog"
  to = "/blog/page/3/"
  status = 301
  force = true
  query = {page = "3"}

