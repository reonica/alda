# Keep the broad legacy HTML URL fallback after all query-specific rules.
# Query parameters pass through, so .html query links resolve in two hops.
[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
