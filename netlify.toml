[build]
  command = "pnpm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.2"

# Redirects are generated from real pages and published article slugs.
# Netlify serves _site/404.html with HTTP 404 for all unknown paths.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
