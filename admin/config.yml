backend:
  name: git-gateway
  branch: main

# Thư mục lưu media
media_folder: "images/blog"
public_folder: "/images/blog"

# Cấu hình collections
collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "blog"
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string", default: "Aldahub"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Featured Image", name: "featured_image", widget: "image", required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: true, required: false, hint: "Draft posts are excluded from the public website. Turn off when ready to publish."}
      - {label: "Tags", name: "tags", widget: "list"}
      - {label: "Body", name: "body", widget: "markdown"}

# Cấu hình giao diện
locale: 'en'
show_preview_links: true
display_url: "https://aldahub.com"
logo_url: "https://aldahub.com/images/alda/alda-logo.png"
